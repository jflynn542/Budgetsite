<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Planner | Budget Site</title><link rel="stylesheet" href="style.css"></head><body data-page="planner"><header class="site-header"><div><h1>Planner</h1><p>Ongoing planned assets and liabilities</p></div><div class="auth-actions">
  <div class="auth-status"><span id="authEmailDisplay">Sign in to load and save your budget data.</span><span id="authMessage" class="muted"></span></div>
  <div class="auth-form signed-out-only">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">
    <button id="emailSignInBtn" class="ghost">Sign in</button>
    <button id="createAccountBtn" class="ghost">Create account</button>
    <button id="googleSignInBtn" class="ghost">Google</button>
  </div>
  <div class="auth-form signed-in-only" hidden>
    <button id="importLegacyBtn" class="ghost" hidden>Import old local data</button>
    <button id="signOutBtn" class="ghost">Sign out</button>
  </div>
</div></header><nav class="top-nav"><a href="index.html">Home</a><a href="pl.html">P+L</a><a href="reserves.html">Reserves</a><a href="planner.html" class="active">Planner</a><a href="currency.html">Currency</a></nav><main><section class="toolbar card"><label>View currency<select id="currencySelect"><option value="EUR">Euro (€)</option><option value="GBP">Pounds (£)</option></select></label></section><section class="summary-grid compact"><div><span>Current assets</span><strong id="plannedCurrentAssets">€0.00</strong></div><div><span>Fixed assets</span><strong id="plannedFixedAssets">€0.00</strong></div><div><span>Liabilities</span><strong id="plannedLiabilities">€0.00</strong></div><div><span>Net plan</span><strong id="plannedNet">€0.00</strong></div></section><section class="card"><h2>Add planner item</h2><div class="form-grid planner-grid"><input id="plannerName" placeholder="Item name"><input id="plannerAmount" type="number" step="0.01" placeholder="Amount"><select id="plannerGroup"><option value="currentAssets">Current asset</option><option value="fixedAssets">Fixed asset</option><option value="liabilities">Liability</option></select><select id="plannerCurrency"><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select><button id="addPlannerBtn">Add</button></div></section><section class="card notes-card"><h2>Notes</h2><textarea id="plannerNotes" class="notes-box" placeholder="Add planner notes..."></textarea></section><section class="card statement"><div class="section-header"><h2>Planner statement</h2><button id="clearPlannerBtn" class="clear-btn">Clear planner</button></div><div id="plannerStatement"></div></section></main><div id="modalRoot"></div><script type="module" src="script.js"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>P+L | Budget Site</title><link rel="stylesheet" href="style.css"></head><body data-page="pl"><header class="site-header"><div><h1>P+L</h1><p>Monthly income, write-offs and expenses</p></div><div class="auth-actions">
  <div class="auth-status"><span id="authEmailDisplay">Sign in to load and save your budget data.</span><span id="authMessage" class="muted"></span></div>
  <div class="auth-form signed-out-only">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">
    <button id="emailSignInBtn" class="ghost">Sign in</button>
    <button id="createAccountBtn" class="ghost">Create account</button>
    <button id="googleSignInBtn" class="ghost">Google</button>
  </div>
  <div class="auth-form signed-in-only" hidden>
    <button id="importLegacyBtn" class="ghost" hidden>Import old local data</button>
    <button id="signOutBtn" class="ghost">Sign out</button>
  </div>
</div></header><nav class="top-nav"><a href="index.html">Home</a><a href="pl.html" class="active">P+L</a><a href="reserves.html">Reserves</a><a href="planner.html">Planner</a><a href="currency.html">Currency</a></nav><main><section class="toolbar card"><label>Financial period<select id="periodSelect"></select></label><button id="todayBtn" class="secondary-btn">Current month</button><label>View currency<select id="currencySelect"><option value="EUR">Euro (€)</option><option value="GBP">Pounds (£)</option></select></label></section><section class="summary-grid compact"><div><span>Income</span><strong id="incomeDisplay">€0.00</strong></div><div><span>Expenses</span><strong id="expenseDisplay">€0.00</strong></div><div><span>Net P+L</span><strong id="balanceDisplay">€0.00</strong></div><div><span>Profit margin</span><strong id="profitMarginDisplay">0%</strong></div></section><section class="two-column compact-forms"><div class="card"><h2>Add income</h2><div class="form-grid"><input id="incomeName" placeholder="Income name"><input id="incomeAmount" type="number" step="0.01" placeholder="Amount"><select id="incomeCurrency"><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select><button id="addIncomeBtn">Add</button></div></div><div class="card"><h2>Add expense</h2><div class="form-grid"><input id="expenseName" placeholder="Expense name"><input id="expenseAmount" type="number" step="0.01" placeholder="Amount"><select id="expenseCategory"><option value="Food + Drink">Food + Drink</option><option value="Entertainment">Entertainment</option><option value="Essential">Essential</option><option value="Other">Other</option><option value="Write offs">Write offs</option></select><select id="expenseCurrency"><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select><button id="addExpenseBtn">Add</button></div></div></section><section class="two-column"><div class="card"><div class="section-header"><h2>Income history</h2><button id="clearIncomeBtn" class="clear-btn">Clear</button></div><div id="incomeList" class="entry-list"></div></div><div class="card"><div class="section-header"><h2>Expense history</h2><button id="clearExpensesBtn" class="clear-btn">Clear</button></div><div id="expenseList" class="entry-list"></div></div></section><section class="card notes-card"><h2>Notes</h2><textarea id="plNotes" class="notes-box" placeholder="Add notes for this month..."></textarea></section><section class="card statement"><h2>Formatted P+L</h2><div id="plStatement"></div></section></main><div id="modalRoot"></div><script type="module" src="script.js"></script></body></html>

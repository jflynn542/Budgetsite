<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Currency | Budget Site</title><link rel="stylesheet" href="style.css"></head><body data-page="currency"><header class="site-header"><div><h1>Currency</h1><p>Set EUR / GBP viewing and logging rates</p></div><div class="auth-actions">
  <div class="auth-status"><span id="authEmailDisplay">Sign in to load and save your budget data.</span><span id="authMessage" class="muted"></span></div>
  <div class="auth-form signed-out-only">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">
    <button id="emailSignInBtn" class="ghost">Sign in</button>
    <button id="createAccountBtn" class="ghost">Create account</button>
    <button id="googleSignInBtn" class="ghost">Google</button>
  </div>
  <div class="auth-form signed-in-only" hidden>
    <button id="importLegacyBtn" class="ghost" hidden>Import old local data</button>
    <button id="signOutBtn" class="ghost">Sign out</button>
  </div>
</div></header><nav class="top-nav"><a href="index.html">Home</a><a href="pl.html">P+L</a><a href="reserves.html">Reserves</a><a href="planner.html">Planner</a><a href="currency.html" class="active">Currency</a></nav><main><section class="card currency-card"><h2>Exchange settings</h2><p class="muted">The site stores everything internally in euro, then converts the display when you switch between euro and pounds.</p><div class="currency-grid"><label>Site display currency<select id="currencySelect"><option value="EUR">Euro (€)</option><option value="GBP">Pounds (£)</option></select></label><label>Exchange rate: £1 equals €<input id="gbpRateInput" type="number" min="0.0001" step="0.0001"></label><button id="saveCurrencyBtn">Save settings</button></div><div class="conversion-box"><h3>Quick converter</h3><div class="form-grid"><input id="convertAmount" type="number" step="0.01" placeholder="Amount"><select id="convertFrom"><option value="EUR">EUR to GBP</option><option value="GBP">GBP to EUR</option></select><strong id="convertResult">€0.00</strong></div></div></section></main><div id="modalRoot"></div><script type="module" src="script.js"></script></body></html>

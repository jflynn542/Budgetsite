<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reserves | Budget Site</title><link rel="stylesheet" href="style.css"></head><body data-page="reserves"><header class="site-header"><div><h1>Reserves</h1><p>Monthly asset and liability snapshot</p></div><div class="auth-actions">
  <div class="auth-status"><span id="authEmailDisplay">Sign in to load and save your budget data.</span><span id="authMessage" class="muted"></span></div>
  <div class="auth-form signed-out-only">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">
    <button id="emailSignInBtn" class="ghost">Sign in</button>
    <button id="createAccountBtn" class="ghost">Create account</button>
    <button id="googleSignInBtn" class="ghost">Google</button>
  </div>
  <div class="auth-form signed-in-only" hidden>
    <button id="importLegacyBtn" class="ghost" hidden>Import old local data</button>
    <button id="signOutBtn" class="ghost">Sign out</button>
  </div>
</div></header><nav class="top-nav"><a href="index.html">Home</a><a href="pl.html">P+L</a><a href="reserves.html" class="active">Reserves</a><a href="planner.html">Planner</a><a href="currency.html">Currency</a></nav><main><section class="toolbar card"><label>Financial period<select id="periodSelect"></select></label><button id="todayBtn" class="secondary-btn">Current month</button><label>View currency<select id="currencySelect"><option value="EUR">Euro (€)</option><option value="GBP">Pounds (£)</option></select></label></section><section class="summary-grid compact"><div><span>Total assets</span><strong id="assetsDisplay">€0.00</strong></div><div><span>Liabilities</span><strong id="liabilitiesDisplay">€0.00</strong></div><div><span>Net reserves</span><strong id="netWorthDisplay">€0.00</strong></div><div><span>Change</span><strong id="reserveChangeDisplay">€0.00</strong></div></section><section class="two-column compact-forms"><div class="card"><h2>Add reserve item</h2><div class="form-grid"><input id="reserveName" placeholder="Name"><input id="reserveAmount" type="number" step="0.01" placeholder="Amount"><select id="reserveGroup"><option value="liquidAssets">Liquid asset</option><option value="fixedAssets">Fixed asset</option><option value="currentAssets">Current asset</option><option value="liabilities">Liability</option></select><select id="reserveCurrency"><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select><button id="addReserveBtn">Add</button></div></div><div class="card"><h2>Quick totals</h2><div id="reserveQuickTotals" class="mini-totals"></div></div></section><section class="card notes-card"><h2>Notes</h2><textarea id="reservesNotes" class="notes-box" placeholder="Add reserves notes for this month..."></textarea></section><section class="card statement"><div class="section-header"><h2>Reserves statement</h2></div><div id="reservesStatement"></div></section></main><div id="modalRoot"></div><script type="module" src="script.js"></script></body></html>
